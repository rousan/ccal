# Release workflow.
#
# To cut a release: bump "version" in package.json on a PR to main, then merge.
# Merging to main reads the version, and if the tag v<version> does not already
# exist, publishes @rousan/ccal to npm and creates the git tag + a GitHub Release
# with auto-generated notes. Plain pushes that don't bump the version re-run this
# but skip (the tag already exists), so no accidental re-release.
#
# It can also be run by hand from the Actions tab, for when the push that should
# have released never got a run — see the note on the trigger below.
#
# Requires a repository secret named NPM_TOKEN: an npm automation token with
# publish rights to the @rousan scope.

name: Release

on:
  push:
    branches: [main]
  # Manual trigger, because a push is not always available when you need one.
  # 1.4.0 was merged to main during a GitHub Actions outage: no workflow ran for
  # the merge, GitHub does not backfill missed runs, and with no dispatch trigger
  # the only way to release was to push another commit to main purely to make
  # something happen. Safe for the same reason the push path is — the job below
  # skips when the tag for the current version already exists — so running this
  # by hand can rescue a missed release but can never double-publish one.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists — skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Will release v$VERSION."
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    name: Publish to npm and GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: ccal v${{ needs.check.outputs.version }}
          generate_release_notes: true
